services:
  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
    volumes:
      - localstack-data:/var/lib/localstack

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: receiptwise
      POSTGRES_PASSWORD: receiptwise
      POSTGRES_DB: receiptwise
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiptwise"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://receiptwise:receiptwise@postgres:5432/receiptwise
      # Must be S3_ENDPOINT_URL — the old AWS_ENDPOINT_URL name is ignored by
      # Settings(extra="ignore"), which silently left this at localhost:4566
      # inside the container and made every upload fall back to local disk.
      S3_ENDPOINT_URL: http://localstack:4566
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  localstack-data:
  pg-data:
