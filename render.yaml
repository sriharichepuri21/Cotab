# Render blueprint for ReceiptWise backend
# https://render.com/docs/blueprint-spec
#
# Prereqs (set BEFORE deploying for the first time, or the app refuses to boot):
#   1. Create a Render Postgres (Supabase works too) and copy its DATABASE_URL.
#   2. Generate a SECRET_KEY:  openssl rand -base64 48
#   3. Get a Gemini API key:   https://aistudio.google.com/app/apikey
#
# After first deploy, add env vars in the Render dashboard → Environment tab:
#   DATABASE_URL, SECRET_KEY, GEMINI_API_KEY, CRON_SECRET (any strong random),
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION, S3_BUCKET,
#   S3_ENDPOINT_URL   ("" for AWS; Supabase object-URL if using Supabase Storage),
#   CORS_ORIGINS      (e.g. "https://your-app.vercel.app")

services:
  - type: web
    name: receiptwise-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Apply pending migrations, then boot. Alembic is the single source of
    # schema truth (create_all was removed); if migrations fail the deploy fails
    # loudly rather than serving against a drifted schema.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Render defaults to the newest Python (3.14 as of 2026-08), which has no
      # pre-built pydantic-core wheel — the build fails compiling from source.
      # Pin until that lands upstream.
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # Secrets below are placeholders — set in dashboard (Render encrypts them).
      #
      # DATABASE_URL: use Supabase's **transaction pooler** URI
      #   (aws-0-<region>.pooler.supabase.com:6543), NOT the direct
      #   db.<ref>.supabase.co:5432 endpoint. The direct host is IPv6-only and
      #   Render's free tier is IPv4-only, so the direct URI fails to connect.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      # Email forwarding (optional; off until all three are set)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: INBOUND_EMAIL_DOMAIN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # Storage. S3_ENDPOINT_URL must be set explicitly — it is NOT optional here.
      # Leaving it unset falls back to the dev default (localhost:4566), which is
      # unreachable in prod; db/s3.py then silently writes to local disk, so
      # uploads look successful and the images vanish on the next deploy.
      # Set "" for real AWS S3, or the Supabase S3-compat endpoint.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: receiptwise-uploads
