name: Backend CI

on:
  pull_request:
    paths: [backend/**]
  push:
    branches: [main]
    paths: [backend/**]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          cd backend
          pip install -r requirements.txt
          pip install email-validator black isort mypy pytest ruff
      - run: |
          cd backend
          black --check app/ alembic/ tests/
          isort --check-only app/ alembic/ tests/
          ruff check app/ tests/ --select E4,E7,E9,F
          # Ratchet typing in from hardened modules. The legacy SQLAlchemy 1.x
          # declarative models need a typed-mapping migration before app-wide mypy.
          mypy app/services/rate_limiter.py --ignore-missing-imports
      - run: |
          cd backend
          python -c "from app.main import app; print('routes:', len(app.routes))"
      - run: |
          cd backend
          pytest -q
