name: Keep API awake

# Render's free plan stops the API after 15 minutes without traffic, and the
# next visitor then waits 30-60 seconds for it to boot. A light ping every
# 10 minutes keeps it running. One always-on free service uses about 744 of
# the 750 free instance hours Render gives each month.
#
# GitHub runs schedules on a best-effort basis (a few minutes late is normal)
# and pauses them after 60 days with no commits to the repo.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          # Generous timeout: if it did fall asleep, this request is the one
          # that wakes it, and booting takes up to a minute.
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 "$API_URL/health"
