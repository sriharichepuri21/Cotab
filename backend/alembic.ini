# Alembic configuration.
# The DB URL is NOT set here — alembic/env.py resolves it from
# DATABASE_URL / backend/.env via app.config.settings at runtime,
# so no credentials live in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =


[post_write_hooks]
# Reformat generated revisions with black + isort to match app/ style.
hooks = black, isort
black.type = console_scripts
black.entrypoint = black
isort.type = console_scripts
isort.entrypoint = isort


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
